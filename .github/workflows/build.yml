name: Build and validate AntiVPN plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run configuration regression tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP environment
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          tools: composer:2.10.3
      - name: Install Composer dependencies
        run: composer install --ignore-platform-reqs --no-interaction --no-progress --prefer-dist
      - name: Run bypass permission regression test
        run: composer run test:bypass-permission
      - name: Run missing API key regression test
        run: composer run test:configuration
  build-phar:
    name: Build plugin PHAR
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@3dedda2a1f6e42885aa680aaadeebacbc0f62733
    with:
      axolotl-ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
      php-version: '8.3'
      pm-version-major: '5'
      prepare-dependencies: true
      phpstan: max
      retention-days: 14
